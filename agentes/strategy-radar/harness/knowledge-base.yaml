description: "Documentos aprobados de Dirección para Strategic Opportunity Radar: Plan estratégico; Análisis de mercado; Roadmap de iniciativas. Consultar para políticas, definiciones y procedimientos; no contiene datos en vivo."
documents:   # PDF, DOCX, XLSX/XLS, CSV, PPTX (solo texto; PDFs escaneados fallan)
