# Knowledge Base - Enterprise Data Analyst  (Build → Knowledge Base → Create Knowledge Base)
name: kb-sql-analyst
description: "Documentos aprobados de Datos para Enterprise Data Analyst: Diccionario de datos; Catálogo de métricas; Políticas de acceso. Consultar para políticas, definiciones y procedimientos; no contiene datos en vivo."
documents:   # PDF, DOCX, XLSX/XLS, CSV, PPTX (solo texto; PDFs escaneados fallan)
  - "Diccionario de datos"
  - "Catálogo de métricas"
  - "Políticas de acceso"
advanced_rag:
  chunk_size: 2000
  chunk_overlap: 200
  results_per_query: 5
  score_threshold: 0.0
  search_strategy: "Similarity"
governance:
  - "Una KB compartida NO replica los ACL de Drive: subir solo documentos visibles para todos los usuarios del agente."
  - "Datos en vivo: vía MCP o Custom Tool, no vía KB."
  - "Esperar estado completed y probar recuperación de pasajes antes de publicar."
