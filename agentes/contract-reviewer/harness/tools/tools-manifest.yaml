# Manifiesto de tools - Contract Review Assistant
# Los nombres son de DISEÑO (capacidades). Para MCP predefinidos, mapear al nombre real en
# Build → MCP Servers → [servidor] → List tools y deshabilitar el resto.

tools:
  - name: read_contract
    source: mcp:drive
    route: "MCP predefinido - Google Drive"
    effect: read
    ask_before_call: false
    purpose: "Leer el contrato o NDA indicado por el usuario (con sus permisos)."
    mcp_tool_real: "<confirmar en List tools>"
  - name: compare_clauses
    source: llm
    route: "Razonamiento del modelo (sin API)"
    effect: llm
    ask_before_call: n/a
    purpose: "Comparar cláusulas contra playbook y plantillas aprobadas (recuperadas de la KB)."
    note: "No requiere tool: lo resuelve el modelo siguiendo la skill. Crear tool solo si se necesita persistir el artefacto."
  - name: search_playbook
    source: kb
    route: "Knowledge Base de VirtuAI (RAG)"
    effect: read
    ask_before_call: n/a
    purpose: "Recuperar posiciones estándar, fallback y no negociables del playbook."
    added_in_kit: true   # no estaba en el HTML; cubre un conector declarado
  - name: draft_redlines
    source: llm
    route: "Razonamiento del modelo (sin API)"
    effect: llm
    ask_before_call: n/a
    purpose: "Proponer texto alternativo sugerido para cada desviación."
    note: "No requiere tool: lo resuelve el modelo siguiendo la skill. Crear tool solo si se necesita persistir el artefacto."
