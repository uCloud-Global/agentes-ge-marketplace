# Manifiesto de tools - Access Governance Analyst
# Los nombres son de DISEÑO (capacidades). Para MCP predefinidos, mapear al nombre real en
# Build → MCP Servers → [servidor] → List tools y deshabilitar el resto.

tools:
  - name: list_access_grants
    source: custom
    route: "Custom Tool HTTP - Cloud Run (IAM)"
    effect: read
    ask_before_call: false
    purpose: "Listar bindings IAM / grupos / roles de los recursos en alcance (Cloud Asset Inventory vía Cloud Run)."
    config: harness/tools/custom/list_access_grants.tool.json
  - name: get_audit_logs
    source: mcp:cloud-logging
    route: "MCP predefinido - Cloud Logging"
    effect: read
    ask_before_call: false
    purpose: "Leer audit logs de uso de permisos (último uso, actor)."
    mcp_tool_real: "<confirmar en List tools>"
  - name: query_access_inventory
    source: mcp:bigquery
    route: "MCP predefinido - BigQuery"
    effect: read
    ask_before_call: false
    purpose: "Consultar export de inventario de accesos y matriz SoD."
    mcp_tool_real: "<confirmar en List tools>"
    added_in_kit: true   # no estaba en el HTML; cubre un conector declarado
  - name: flag_excess_privilege
    source: llm
    route: "Razonamiento del modelo (sin API)"
    effect: llm
    ask_before_call: n/a
    purpose: "Comparar permisos vs. política y marcar exceso con evidencia."
    note: "No requiere tool: lo resuelve el modelo siguiendo la skill. Crear tool solo si se necesita persistir el artefacto."
  - name: draft_review
    source: mcp:drive
    route: "MCP predefinido - Google Drive"
    effect: draft
    ask_before_call: true
    purpose: "Crear documento de recertificación en borrador para el owner (Ask)."
    mcp_tool_real: "<confirmar en List tools>"
