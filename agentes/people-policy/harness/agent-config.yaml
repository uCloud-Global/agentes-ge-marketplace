# Agent Harness Kit - People Policy Advisor
# Mapea 1:1 con la UI de VirtuAI (Agents → New agent / pestañas del agente).
# No es un formato de importación nativo: el import nativo es por Git (AGENTS.md + skills/*/SKILL.md) o .virtuai.json.

agent:
  id: people-policy            # ID inmutable sugerido
  name: "People Policy Advisor"
  description: "Responde preguntas sobre políticas internas con referencias, país y vigencia."
  group: "Talento"
  tags: [talento, agentes-ge, a2a, read-only]
  agent_type: classic   # Classic = conversacional; Deep = planificación, skills, memoria, sub-agentes, workspace

model:                       # Settings → Models & providers + pestaña Model
  provider: vertex-ai          # VERTEX_AI_SERVICE_ACCOUNT_JSON / VERTEX_AI_PROJECT_ID / VERTEX_AI_LOCATION
  model: "Gemini Flash (última versión GA aprobada en Vertex AI)"
  allowed_models_web_chat: []  # vacío = solo el modelo fijado
  temperature: 0.1
  max_output_tokens: 3000   # el default de VirtuAI (1000) es insuficiente para este agente

native_capabilities:
  thinking: {enabled: false}
  show_reasoning: false
  prompt_caching: true
  web_search: false
  web_fetch: false
  tool_search: false

instructions:
  system_prompt_file: AGENTS.md
  skills: []                 # Classic no admite skills: procedimientos embebidos en AGENTS.md
  procedures: [policy-answer, policy-gap-escalation]

memory:
  enabled: false             # Classic: sin memoria de largo plazo

knowledge_bases:
  - kb-people-policy              # ver harness/knowledge-base.yaml

tools:
  mcp_servers: [Google Drive]   # ver harness/tools/mcp-servers.md
  custom_tools: []   # ver harness/tools/custom/
  builtin: []
  manifest: harness/tools/tools-manifest.yaml

security:
  read_only: true
  ask_before_running_commands: false
  standing_approvals: []      # no conceder "Always allow" a tools de escritura

channels:                    # pestaña Channels
  a2a: true                   # Gemini Enterprise
  web_chat: true              # solo para pruebas internas; desactivar si no se usa
  google_chat: false
  slack: false
  telegram: false
  cli: false

versioning:
  enabled: true               # activar ANTES de editar producción

publishing_policy:
  require_second_approver: true
  min_eval_pass_rate: 90

guardrails:                  # Enterprise - Monitor → Classifiers (inicia en shadow mode)
  classifiers: [prompt_injection, off_topic]
  mode: shadow                # pasar a enforce tras 2 semanas de observación
  restrict_automatically: false

budget:
  monthly_limit_usd: TBD
  alerts_percent: [50, 80, 100]

evaluations:
  dataset: eval-people-policy   # ver harness/evals/eval-dataset.json
  tools_during_run: mock

retention:
  conversations_days: 90
