# Knowledge Base - Data Quality Sentinel  (Build → Knowledge Base → Create Knowledge Base)
name: kb-data-quality
description: "Documentos aprobados de Datos para Data Quality Sentinel: Contratos de datos; Reglas de calidad; SLA de actualización. Consultar para políticas, definiciones y procedimientos; no contiene datos en vivo."
documents:   # PDF, DOCX, XLSX/XLS, CSV, PPTX (solo texto; PDFs escaneados fallan)
  - "Contratos de datos"
  - "Reglas de calidad"
  - "SLA de actualización"
advanced_rag:
  chunk_size: 2000
  chunk_overlap: 200
  results_per_query: 5
  score_threshold: 0.0
  search_strategy: "Similarity"
governance:
  - "Una KB compartida NO replica los ACL de Drive: subir solo documentos visibles para todos los usuarios del agente."
  - "Datos en vivo: vía MCP o Custom Tool, no vía KB."
  - "Esperar estado completed y probar recuperación de pasajes antes de publicar."
