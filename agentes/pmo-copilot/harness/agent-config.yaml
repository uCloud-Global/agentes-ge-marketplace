# Agent Harness Kit - Project PMO Copilot
# Mapea 1:1 con la UI de VirtuAI (Agents → New agent / pestañas del agente).
# No es un formato de importación nativo: el import nativo es por Git (AGENTS.md + skills/*/SKILL.md) o .virtuai.json.

agent:
  id: pmo-copilot            # ID inmutable sugerido
  name: "Project PMO Copilot"
  description: "Consolida actas, hitos y bloqueos; genera estados de proyecto y próximos compromisos."
  group: "Operaciones"
  tags: [operaciones, agentes-ge, a2a, read-only]
  agent_type: deep   # Classic = conversacional; Deep = planificación, skills, memoria, sub-agentes, workspace

model:                       # Settings → Models & providers + pestaña Model
  provider: vertex-ai          # VERTEX_AI_SERVICE_ACCOUNT_JSON / VERTEX_AI_PROJECT_ID / VERTEX_AI_LOCATION
  model: "Gemini Pro (última versión GA aprobada en Vertex AI)"
  allowed_models_web_chat: []  # vacío = solo el modelo fijado
  temperature: 0.3
  max_output_tokens: 6000   # el default de VirtuAI (1000) es insuficiente para este agente

native_capabilities:
  thinking: {enabled: true, effort: low}
  show_reasoning: false
  prompt_caching: true
  web_search: false
  web_fetch: false
  tool_search: false

instructions:
  system_prompt_file: AGENTS.md
  skills:                    # Build → Skills, luego Instructions → Skills
    - project-report
    - meeting-minutes
    - risk-register

memory:
  enabled: true              # 16 KB, global y compartida entre usuarios: sin PII
  initial_memory: "Criterio RAG: rojo = hito vencido o bloqueo >5 días; ámbar = riesgo alto abierto."
  admin_alerts_on_change: true

knowledge_bases:
  - kb-pmo-copilot              # ver harness/knowledge-base.yaml

tools:
  mcp_servers: [Gmail, Google Calendar, Google Drive]   # ver harness/tools/mcp-servers.md
  custom_tools: [get_milestones]   # ver harness/tools/custom/
  builtin: []
  manifest: harness/tools/tools-manifest.yaml

execution:                   # Deep: Workstation → CLI emparejada → sandbox E2B → FS virtual
  environment: virtual-fs   # sin shell: no se requiere workstation
  ask_before_running_commands: true

security:
  read_only: false   # agente de lectura con tools de borrador: mantener false y Ask en borradores
  ask_before_running_commands: true
  standing_approvals: []      # no conceder "Always allow" a tools de escritura

channels:                    # pestaña Channels
  a2a: true                   # Gemini Enterprise
  web_chat: true              # solo para pruebas internas; desactivar si no se usa
  google_chat: false
  slack: false
  telegram: false
  cli: false

versioning:
  enabled: true               # activar ANTES de editar producción

publishing_policy:
  require_second_approver: false
  min_eval_pass_rate: 80

guardrails:                  # Enterprise - Monitor → Classifiers (inicia en shadow mode)
  classifiers: [prompt_injection, off_topic]
  mode: shadow                # pasar a enforce tras 2 semanas de observación
  restrict_automatically: false

budget:
  monthly_limit_usd: TBD
  alerts_percent: [50, 80, 100]

evaluations:
  dataset: eval-pmo-copilot   # ver harness/evals/eval-dataset.json
  tools_during_run: mock

retention:
  conversations_days: 365
