# Knowledge Base - Employee Onboarding Navigator  (Build → Knowledge Base → Create Knowledge Base)
name: kb-onboarding-agent
description: "Documentos aprobados de Talento para Employee Onboarding Navigator: Manual de bienvenida; Checklist de ingreso; Políticas TI; Beneficios. Consultar para políticas, definiciones y procedimientos; no contiene datos en vivo."
documents:   # PDF, DOCX, XLSX/XLS, CSV, PPTX (solo texto; PDFs escaneados fallan)
  - "Manual de bienvenida"
  - "Checklist de ingreso"
  - "Políticas TI"
  - "Beneficios"
advanced_rag:
  chunk_size: 1500
  chunk_overlap: 200
  results_per_query: 6
  score_threshold: 0.2
  search_strategy: "Similarity"
governance:
  - "Una KB compartida NO replica los ACL de Drive: subir solo documentos visibles para todos los usuarios del agente."
  - "Datos en vivo: vía MCP o Custom Tool, no vía KB."
  - "Esperar estado completed y probar recuperación de pasajes antes de publicar."
