# Manifiesto de tools - Employee Onboarding Navigator
# Los nombres son de DISEÑO (capacidades). Para MCP predefinidos, mapear al nombre real en
# Build → MCP Servers → [servidor] → List tools y deshabilitar el resto.

tools:
  - name: get_onboarding_plan
    source: mcp:drive
    route: "MCP predefinido - Google Drive"
    effect: read
    ask_before_call: false
    purpose: "Leer checklist de ingreso y manual de bienvenida por área."
    mcp_tool_real: "<confirmar en List tools>"
  - name: schedule_welcome
    source: mcp:calendar
    route: "MCP predefinido - Google Calendar"
    effect: write
    ask_before_call: true
    purpose: "Crear eventos de bienvenida/inducción. Escritura con Ask (validar invitados)."
    mcp_tool_real: "<confirmar en List tools>"
  - name: draft_welcome_mail
    source: mcp:gmail
    route: "MCP predefinido - Gmail"
    effect: draft
    ask_before_call: true
    purpose: "Crear BORRADOR de correo de bienvenida."
    mcp_tool_real: "<confirmar en List tools>"
  - name: request_access
    source: custom
    route: "Custom Tool HTTP - Cloud Run (IAM)"
    effect: write
    ask_before_call: true
    purpose: "Crear solicitud de accesos en ITSM (Cloud Run). Escritura con Ask y visto bueno de TI."
    config: harness/tools/custom/request_access.tool.json
