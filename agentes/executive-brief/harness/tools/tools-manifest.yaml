# Manifiesto de tools - Executive Intelligence
# Los nombres son de DISEÑO (capacidades). Para MCP predefinidos, mapear al nombre real en
# Build → MCP Servers → [servidor] → List tools y deshabilitar el resto.

tools:
  - name: get_kpis
    source: mcp:bigquery
    route: "MCP predefinido - BigQuery"
    effect: read
    ask_before_call: false
    purpose: "Leer KPIs/OKR certificados del periodo desde las vistas de dirección (solo SELECT sobre datasets allowlisted)."
    mcp_tool_real: "<confirmar en List tools>"
  - name: search_drive
    source: mcp:drive
    route: "MCP predefinido - Google Drive"
    effect: read
    ask_before_call: false
    purpose: "Buscar actas ejecutivas y reportes de dirección del periodo con permisos del usuario."
    mcp_tool_real: "<confirmar en List tools>"
  - name: search_mail
    source: mcp:gmail
    route: "MCP predefinido - Gmail"
    effect: read
    ask_before_call: false
    purpose: "Buscar hilos con decisiones pendientes o escalamientos dirigidos al comité."
    mcp_tool_real: "<confirmar en List tools>"
    added_in_kit: true   # no estaba en el HTML; cubre un conector declarado
  - name: draft_executive_brief
    source: llm
    route: "Razonamiento del modelo (sin API)"
    effect: llm
    ask_before_call: n/a
    purpose: "Redactar el briefing a partir de evidencia citada; no requiere API externa."
    note: "No requiere tool: lo resuelve el modelo siguiendo la skill. Crear tool solo si se necesita persistir el artefacto."
