# Manifiesto de tools - Supplier Risk Analyst
# Los nombres son de DISEÑO (capacidades). Para MCP predefinidos, mapear al nombre real en
# Build → MCP Servers → [servidor] → List tools y deshabilitar el resto.

tools:
  - name: get_supplier_kpis
    source: mcp:bigquery
    route: "MCP predefinido - BigQuery"
    effect: read
    ask_before_call: false
    purpose: "Leer OTIF, calidad, incidencias y volumen por proveedor."
    mcp_tool_real: "<confirmar en List tools>"
  - name: search_contract
    source: mcp:drive
    route: "MCP predefinido - Google Drive"
    effect: read
    ask_before_call: false
    purpose: "Buscar contrato y SLA vigentes del proveedor."
    mcp_tool_real: "<confirmar en List tools>"
  - name: score_risk
    source: custom
    route: "Custom Tool HTTP - Cloud Run (IAM)"
    effect: compute
    ask_before_call: false
    purpose: "Calcular score de riesgo con matriz de homologación versionada (Cloud Run)."
    config: harness/tools/custom/score_risk.tool.json
  - name: prepare_review
    source: llm
    route: "Razonamiento del modelo (sin API)"
    effect: llm
    ask_before_call: n/a
    purpose: "Preparar plan de revisión/recomendación."
    note: "No requiere tool: lo resuelve el modelo siguiendo la skill. Crear tool solo si se necesita persistir el artefacto."
